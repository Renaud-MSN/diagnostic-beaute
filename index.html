<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#6D6C4B">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Diagnostic Beauté">
<meta property="og:type" content="website"><meta property="og:title" content="Diagnostic Beauté – Maison Diaphane">
<meta property="og:description" content="Comprendre vos besoins et préparer votre routine de soins.">
<meta property="og:image" content="https://renaud-msn.github.io/diagnostic-beaute/og.png"><meta property="og:url" content="https://renaud-msn.github.io/diagnostic-beaute/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Diagnostic Beauté – Maison Diaphane</title>
<style>
:root{--t:#6D6C4B;--tl:#efede4;--bg:#faf8f3;--tx:#2b2a22;--mu:#7a786a;--bd:#d9d5c4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;font-size:19px;line-height:1.5}
header{text-align:center;padding:18px 12px 6px;letter-spacing:.25em;font-size:13px;color:var(--t)}
main{max-width:820px;margin:0 auto;padding:8px 20px 90px}
h1{font-weight:normal;color:var(--t);font-size:30px;margin:14px 0 6px}
h2{font-weight:normal;color:var(--t);font-size:24px;margin:10px 0}
.sub{color:var(--mu);font-size:16px;margin:0 0 18px}
.prog{height:5px;background:var(--bd);border-radius:3px;margin:8px 0 22px}.prog i{display:block;height:100%;background:var(--t);border-radius:3px}
.opt{display:block;width:100%;text-align:left;padding:16px 18px;margin:0 0 10px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;font:inherit;color:inherit;cursor:pointer;min-height:56px}
.opt.on{border-color:var(--t);background:var(--tl);box-shadow:inset 0 0 0 1px var(--t)}
.opt[disabled]{opacity:.45}
.btn{font:inherit;border:0;border-radius:12px;padding:15px 26px;background:var(--t);color:#fff;cursor:pointer;min-height:54px}
.btn.sec{background:#fff;color:var(--t);border:1.5px solid var(--t)}
.btn[disabled]{opacity:.4;cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:12px 20px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:space-between;max-width:none}
.nav>div{max-width:820px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:12px}
textarea,input[type=text]{width:100%;font:inherit;padding:13px;border:1.5px solid var(--bd);border-radius:10px;background:#fff}
.pro{margin-top:18px;padding:14px;border:1.5px dashed var(--t);border-radius:12px;background:#f4f2e8}
.pro b{color:var(--t);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.note{font-size:14px;color:var(--mu)}
.err{color:#9a3b2e;font-size:15px;margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:16px}td,th{border-bottom:1px solid var(--bd);padding:8px 6px;text-align:left;vertical-align:top}
.bloc{border:1px solid var(--bd);border-radius:12px;padding:14px 18px;margin:0 0 16px;background:#fff}
.tag{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--t);padding:2px 8px;border-radius:10px;margin-bottom:6px}
.tag.p{background:#8a6a3a}.tag.m{background:#5b5b5b}
.foot{margin-top:26px;text-align:center}
a.lk{color:var(--t);cursor:pointer;text-decoration:underline;font-size:15px}
@media print{header,.nav,.noprint{display:none!important}body{background:#fff;font-size:12pt}main{padding:0;max-width:none}.bloc{break-inside:avoid}}
</style>
</head>
<body>

<main id="app"></main>
<script src="catalogue.js"></script>
<script>
/* ===== Configuration du questionnaire (données, pas de logique métier cachée) =====
   Seules les questions au statut « Proposé » de l'étape 5 sont actives.
   Questions en attente de Marie-Sophie (non affichées) : D5, E3, E5, E6, F2, F4, F5, H1 ; C2 affichée à titre « à valider ». */
const UNIVERS=[{id:'visage',l:'Visage'},{id:'corps',l:'Corps'},{id:'mains',l:'Mains'},{id:'bucco',l:'Bucco-dentaire'}];
/* Cheveux et Lèvres : existent dans l'architecture, masqués tant que leurs conseils ne sont pas validés. */
const PREOC={
 visage:['Imperfections','Pores visibles','Points noirs','Manque d’éclat','Teint irrégulier','Taches pigmentaires','Rides et ridules','Perte de fermeté','Contour des yeux','Nutrition et confort','Barrière cutanée'],
 corps:['Nutrition','Manque de confort','Rugosités','Exfoliation','Fermeté','Entretien quotidien','Soins selon les zones'],
 mains:['Protection','Rugosités','Entretien des ongles','Soin des cuticules','Confort quotidien','Sécheresse','Déshydratation','Nutrition'],
 bucco:['Hygiène quotidienne','Fraîcheur de l’haleine','Sensibilité dentaire','Confort des gencives','Entretien buccal']};
const Q=[
 {id:'A1',bloc:'Univers',t:'Quels soins souhaitez-vous explorer ?',k:'multi',o:UNIVERS.map(u=>u.l).concat(['Tous']),req:true,aide:'Vous pouvez en choisir plusieurs. « Tous » sélectionne tous les univers.'},
 {id:'B2',bloc:'Habitudes',t:'Comment décririez-vous vos habitudes de soin actuellement ?',k:'single',o:['Je n’ai pas vraiment de routine','J’utilise quelques produits','J’ai une routine régulière','J’ai une routine déjà bien établie']},
 {id:'B3',bloc:'Habitudes',t:'Qu’aimeriez-vous obtenir grâce à ce diagnostic ?',k:'single',o:['Mieux comprendre mes besoins','Construire une routine adaptée','Trouver des soins pour une préoccupation précise','Faire le point sur ma routine actuelle','Découvrir de nouveaux soins']},
 {id:'C1',bloc:'Profil cutané',u:'visage',t:'Quel est votre type de peau ?',k:'single',o:['Normale','Sèche','Grasse','Mixte','Je ne sais pas'],req:true},
 {id:'C2',bloc:'Profil cutané',u:'visage',t:'Après avoir nettoyé votre visage et laissé votre peau au repos, comment la ressentez-vous habituellement ?',k:'single',o:['Elle tiraille et manque de confort','Elle brille assez rapidement','Elle brille surtout sur le front, le nez et le menton','Elle reste confortable et équilibrée','Je ne parviens pas à déterminer mon type de peau'],si:a=>a.C1==='Je ne sais pas',aide:'Cette réponse oriente l’échange ; elle ne fixe pas votre type de peau. Formulation à valider par Marie-Sophie.'},
 {id:'C3',bloc:'Profil cutané',u:'visage',t:'Votre peau réagit-elle facilement de manière habituelle ?',k:'single',o:['Oui, fréquemment','Parfois','Rarement ou jamais','Je ne sais pas']},
 {id:'C4',bloc:'Profil cutané',u:'visage',t:'En ce moment, constatez-vous l’un des phénomènes suivants ?',k:'multi',o:['Sensation de déshydratation ou de tiraillement','Rougeurs inhabituelles','Réactions ou sensibilité inhabituelle','Aucun de ces phénomènes','Je ne sais pas'],excl:['Aucun de ces phénomènes','Je ne sais pas']},
 {id:'D1',bloc:'Préoccupations',u:'visage',t:'Quelle est votre priorité principale pour les soins de votre visage ?',k:'single',o:PREOC.visage,req:true},
 {id:'D2',bloc:'Préoccupations',u:'visage',t:'Quels autres aspects souhaiteriez-vous également prendre en compte ?',k:'multi',max:2,o:PREOC.visage,horsDe:'D1',aide:'Facultatif, jusqu’à 2.'},
 {id:'D3',bloc:'Préoccupations',u:'corps',t:'Quel est votre besoin principal pour les soins de votre corps ?',k:'single',o:PREOC.corps,req:true},
 {id:'D4',bloc:'Préoccupations',u:'corps',t:'Quels autres besoins souhaiteriez-vous prendre en compte ?',k:'multi',max:2,o:PREOC.corps,horsDe:'D3',aide:'Facultatif, jusqu’à 2.'},
 {id:'D6',bloc:'Préoccupations',u:'mains',t:'Quel est votre besoin principal pour les soins de vos mains ?',k:'single',o:PREOC.mains,req:true},
 {id:'D7',bloc:'Préoccupations',u:'mains',t:'Quels autres besoins souhaitez-vous prendre en compte ?',k:'multi',max:2,o:PREOC.mains,horsDe:'D6',aide:'Facultatif, jusqu’à 2.'},
 {id:'D8',bloc:'Préoccupations',u:'bucco',t:'Quel est votre objectif principal en matière d’hygiène et de confort bucco-dentaire ?',k:'single',o:PREOC.bucco,req:true},
 {id:'D9',bloc:'Préoccupations',u:'bucco',t:'Avez-vous d’autres attentes complémentaires ?',k:'multi',max:2,o:PREOC.bucco,horsDe:'D8',aide:'Facultatif, jusqu’à 2.'},
 {id:'E1',bloc:'Habitudes et environnement',u:'visage',t:'À quels moments prenez-vous actuellement soin de votre visage ?',k:'single',o:['Le matin','Le soir','Le matin et le soir','Je n’ai pas de routine régulière']},
 {id:'E2',bloc:'Habitudes et environnement',t:'À quelle fréquence utilisez-vous actuellement des soins dans cet univers ?',k:'single',parU:true,o:['Tous les jours','Plusieurs fois par semaine','Occasionnellement','Jamais']},
 {id:'E4',bloc:'Habitudes et environnement',t:'Dans votre quotidien, êtes-vous régulièrement exposé(e) à l’un des éléments suivants ?',k:'multi',o:['Soleil','Froid et vent','Chauffage ou climatisation','Pollution','Aucun en particulier'],excl:['Aucun en particulier']},
 {id:'F1',bloc:'Préférences',t:'Quelles textures appréciez-vous pour vos soins ?',k:'single',o:['Légères','Riches et enveloppantes','Sans préférence particulière']},
 {id:'F3',bloc:'Préférences',t:'Quelle est votre préférence concernant les produits parfumés ?',k:'single',o:['Je préfère les produits parfumés','Je préfère les produits sans parfum','Cela m’est égal']},
 {id:'G1',bloc:'Allergies et précautions',t:'Avez-vous connaissance d’allergies ou d’intolérances à certains ingrédients ou produits de soin ?',k:'single',o:['Non, aucune connue','Oui','Je ne sais pas'],req:true,precise:'Oui',aide:'« Je ne sais pas » reste distinct de « Non » : une information inconnue n’est jamais considérée comme favorable.'},
 {id:'G2',bloc:'Allergies et précautions',t:'Souhaitez-vous nous signaler une précaution particulière à prendre en compte pour votre conseil beauté ?',k:'text',aide:'Facultatif. Inutile de détailler des informations médicales.'}
];
const hasU=(a,u)=>{const s=a.A1||[];return s.includes('Tous')||s.includes(UNIVERS.find(x=>x.id===u).l)};
function univSel(a){return UNIVERS.filter(u=>hasU(a,u.id))}
/* Parcours : liste d'écrans calculée à partir des réponses (chaque écran = 1 question) */
function parcours(a){
  const out=[];
  for(const q of Q){
    if(q.parU){for(const u of univSel(a)) out.push({q,u:u.id,key:q.id+'@'+u.id});continue}
    if(q.u && !hasU(a,q.u)) continue;
    if(q.si && !q.si(a)) continue;
    if(q.id!=='A1' && !(a.A1&&a.A1.length)) continue;
    out.push({q,key:q.id});
  }
  return out;
}
/* ===== État ===== */
let S={mode:null,etape:'accueil',i:0,consent:false,consentCom:false,
  declare:{},precisions:{},observationsPro:{},modifications:[],
  catalogue:{genere:CATALOGUE_META.genere,nbProduits:CATALOGUE_META.nbProduits},
  moteur:{statut:'non disponible — conseils produit non validés',propositions:[]},
  id:null,debut:null,client:{nom:'',contact:''}};
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== Stockage local (IndexedDB), comme l'application olfactive : par appareil, rien n'est envoyé ===== */
const DB={open(){return new Promise((r,j)=>{const q=indexedDB.open('diagnostic-beaute',1);q.onupgradeneeded=()=>q.result.createObjectStore('diag',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})},
 async put(o){const d=await this.open();return new Promise((r,j)=>{const t=d.transaction('diag','readwrite');t.objectStore('diag').put(o);t.oncomplete=r;t.onerror=()=>j(t.error)})},
 async all(){const d=await this.open();return new Promise((r,j)=>{const q=d.transaction('diag').objectStore('diag').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}};
function record(){return{id:S.id,version:1,mode:S.mode,debut:S.debut,fin:new Date().toISOString(),
  consentementRGPD:S.consent,consentementCommercial:S.consentCom,client:S.client,
  /* cinq natures de données, toujours séparées */
  reponsesDeclarees:S.declare,precisionsDeclarees:S.precisions,
  observationsProfessionnelles:S.observationsPro,
  catalogue:S.catalogue,
  propositionsMoteur:S.moteur,
  modificationsProfessionnelles:S.modifications}}
/* ===== Rendu ===== */
function render(){
  if(S.etape==='accueil')return accueil();
  if(S.etape==='client')return client();
  if(S.etape==='q')return question();
  if(S.etape==='fin')return fin();
  if(S.etape==='trace')return trace();
}
function accueil(){
 app.innerHTML=`<div style="text-align:center"><img src="logo.png" alt="Maison Diaphane – Diagnostic Beauté" style="width:230px;max-width:60%"></div><p class="sub" style="text-align:center">Quelques questions pour comprendre vos besoins et préparer votre routine. Aucun diagnostic médical, dentaire ou dermatologique.</p>
 <div class="bloc"><label><input type="checkbox" id="c1" ${S.consent?'checked':''}> J’accepte que mes réponses soient enregistrées sur cet appareil pour établir mon diagnostic beauté. <span class="note">(obligatoire)</span></label></div>
 <div class="bloc"><label><input type="checkbox" id="c2" ${S.consentCom?'checked':''}> J’accepte de recevoir par e-mail les actualités, nouveautés et invitations de Maison Diaphane. <span class="note">(facultatif, sans effet sur le diagnostic)</span></label></div>
 <p id="e" class="err"></p>
 <button class="opt" id="m1">Commencer</button>
 <div class="foot noprint"><a class="lk" id="tr">Trace des diagnostics</a></div>`;
 const go=m=>{S.consent=$('#c1').checked;S.consentCom=$('#c2').checked;if(!S.consent){$('#e').textContent='Votre accord est nécessaire pour commencer.';return}S.mode=m;S.id='db-'+Date.now();S.debut=new Date().toISOString();S.etape='client';render()};
 $('#m1').onclick=()=>go('unique');$('#tr').onclick=()=>{S.etape='trace';render()};
}
function client(){
 app.innerHTML=`<h2>Pour retrouver votre diagnostic</h2><p class="sub">Facultatif : ces informations ne servent pas au conseil.</p>
 <p><input type="text" id="n" placeholder="Prénom et nom" value="${esc(S.client.nom)}"></p><p><input type="text" id="m" placeholder="Adresse e-mail" value="${esc(S.client.contact)}"></p>`+nav(()=>{S.etape='accueil';render()},()=>{S.client.nom=$('#n').value.trim();S.client.contact=$('#m').value.trim();S.etape='q';S.i=0;render()},true);
}
function nav(back,next,ok,label){
 setTimeout(()=>{$('#bk').onclick=back;$('#nx').onclick=next},0);
 return`<div class="nav noprint"><div><button class="btn sec" id="bk">Retour</button><button class="btn" id="nx" ${ok?'':'disabled'}>${label||'Continuer'}</button></div></div>`;
}
function question(){
 const P=parcours(S.declare),it=P[S.i];
 if(!it){S.etape='fin';return render()}
 const q=it.q,key=it.key,val=S.declare[key];
 let opts=q.o;
 if(q.horsDe){const pr=S.declare[q.horsDe];opts=opts.filter(x=>x!==pr)}
 const sel=q.k==='multi'?(val||[]):val;
 const univ=it.u?UNIVERS.find(x=>x.id===it.u).l:'';
 const titre=q.t+(q.parU?` (${univ})`:'');
 let body=`<div class="prog"><i style="width:${Math.round(S.i/Math.max(P.length,1)*100)}%"></i></div><p class="note">${esc(q.bloc)} · ${S.i+1}/${P.length}</p><h2>${esc(titre)}</h2>${q.aide?`<p class="sub">${esc(q.aide)}</p>`:''}`;
 if(q.k==='text') body+=`<textarea id="tx" rows="3">${esc(val||'')}</textarea>`;
 else body+=opts.map((o,j)=>`<button class="opt ${(q.k==='multi'?sel.includes(o):sel===o)?'on':''}" data-j="${j}">${esc(o)}</button>`).join('');
 if(q.precise&&val===q.precise) body+=`<p><input type="text" id="pr" placeholder="Précisez les ingrédients ou produits concernés" value="${esc(S.precisions[key]||'')}"></p>`;
 body+=`<div class="pro"><b>Note complémentaire (facultatif)</b><textarea id="ob" rows="2" placeholder="Précision ou observation, distincte de la réponse">${esc(S.observationsPro[key]||'')}</textarea></div>`;
 const ok=q.req?(q.k==='multi'?(sel&&sel.length>0):!!sel):true;
 app.innerHTML=body+`<p id="e" class="err"></p>`+nav(()=>{if(S.i>0){S.i--}else{S.etape='client'}render()},()=>{
   if(q.precise&&S.declare[key]===q.precise){const p=$('#pr');S.precisions[key]=p?p.value.trim():''}
   {const o=$('#ob');if(o)S.observationsPro[key]=o.value.trim()}
   if(q.k==='text')set(key,$('#tx').value.trim(),q);
   S.i++;render()},ok);
 document.querySelectorAll('.opt[data-j]').forEach(b=>b.onclick=()=>{
   const o=opts[+b.dataset.j];
   if(q.k==='single'){set(key,o,q)}
   else{let a=(S.declare[key]||[]).slice();
     if(a.includes(o))a=a.filter(x=>x!==o);
     else{ if(q.id==='A1'&&o==='Tous')a=['Tous'];
       else if(q.id==='A1')a=a.filter(x=>x!=='Tous').concat(o);
       else if(q.excl&&q.excl.includes(o))a=[o];
       else{a=a.filter(x=>!(q.excl||[]).includes(x));if(q.max&&a.length>=q.max)return flash(`Jusqu’à ${q.max} choix.`);a.push(o)}}
     set(key,a,q)}
   // une préoccupation principale ne peut pas rester en secondaire
   for(const s of Q.filter(z=>z.horsDe===q.id)){const v=S.declare[s.id];if(v)S.declare[s.id]=v.filter(x=>x!==S.declare[q.id])}
   const keep=S.i;render();S.i=keep});
}
function flash(m){const e=$('#e');if(e)e.textContent=m}
function set(key,v,q){
 const before=S.declare[key];
 if(before!==undefined&&JSON.stringify(before)!==JSON.stringify(v))
   S.modifications.push({question:key,avant:before,apres:v,date:new Date().toISOString(),accordClient:null});
 S.declare[key]=v;
}
async function fin(){
 const rec=record();try{await DB.put(rec)}catch(e){}
 const P=parcours(S.declare);
 const lignes=P.map(it=>{const v=S.declare[it.key];const t=it.q.t+(it.q.parU?` (${UNIVERS.find(x=>x.id===it.u).l})`:'');
   return`<tr><td>${esc(t)}</td><td>${esc(Array.isArray(v)?v.join(', '):(v||'—'))}${S.precisions[it.key]?`<br><span class="note">Précisé : ${esc(S.precisions[it.key])}</span>`:''}</td></tr>`}).join('');
 const obs=Object.entries(S.observationsPro).filter(e=>e[1]);
 const g1=S.declare.G1;
 app.innerHTML=`<div style="text-align:center"><img src="logo.png" alt="Maison Diaphane – Diagnostic Beauté" style="width:170px"></div><h1>Votre diagnostic beauté</h1><p class="sub">${esc(S.client.nom)} · ${new Date(S.debut).toLocaleDateString('fr-FR')} · Diagnostic Beauté</p>
 <div class="bloc"><span class="tag">Réponses déclarées</span><table>${lignes}</table></div>
 <div class="bloc"><span class="tag m">Allergies et précautions</span><p>Allergies ou intolérances : <b>${esc(g1||'non renseigné')}</b>${S.precisions.G1?' — '+esc(S.precisions.G1):''}.<br><span class="note">Une composition absente ou incomplète n’est jamais présentée comme compatible.</span></p></div>
 <div class="bloc"><span class="tag m">Produits et routine</span><p>Les recommandations de produits et la routine seront proposées lorsque les conseils par produit auront été validés par Marie-Sophie. Aucune recommandation n’est générée à ce stade.</p><p class="note">Catalogue de référence : ${CATALOGUE_META.nbProduits} produits, lu le ${esc(CATALOGUE_META.genere)}.</p></div>
 <div class="bloc noprint"><span class="tag p">Notes complémentaires (usage interne, hors PDF)</span>${obs.length?'<table>'+obs.map(e=>`<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td></tr>`).join('')+'</table>':'<p class="note">Aucune.</p>'}${S.modifications.length?`<p class="note">${S.modifications.length} modification(s) de réponse enregistrée(s).</p>`:''}</div>
 <p class="note">Enregistré sur cet appareil. Ce diagnostic ne constitue pas un avis médical.</p>
 <div class="foot noprint"><button class="btn" id="pdf">Enregistrer en PDF</button> <button class="btn sec" id="nw">Nouveau diagnostic</button></div>`;
 $('#pdf').onclick=()=>window.print();
 $('#nw').onclick=()=>{S={...S,mode:null,etape:'accueil',i:0,declare:{},precisions:{},observationsPro:{},modifications:[],client:{nom:'',contact:''},id:null};render()};
}
async function trace(){
 const all=(await DB.all()).sort((a,b)=>b.fin.localeCompare(a.fin));
 app.innerHTML=`<h2>Trace des diagnostics (cet appareil)</h2><table>${all.map(r=>`<tr><td>${new Date(r.fin).toLocaleString('fr-FR')}</td><td>${esc(r.client&&r.client.nom||'—')}</td><td>${r.mode}</td></tr>`).join('')||'<tr><td>Aucun.</td></tr>'}</table>
 <div class="foot"><button class="btn sec" id="ex">Exporter la sauvegarde (JSON)</button> <button class="btn sec" id="bk2">Retour</button></div>`;
 $('#bk2').onclick=()=>{S.etape='accueil';render()};
 $('#ex').onclick=()=>{const b=new Blob([JSON.stringify(all,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='diagnostic-beaute-sauvegarde.json';a.click()};
}
render();
</script>
</body>
</html>
